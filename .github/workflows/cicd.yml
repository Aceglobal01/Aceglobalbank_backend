name: Bank Backend Pipeline

on:
  push:
    branches:
    - dev-branch
  pull_request:
    branches:
    - cicd

jobs:
  Continuous-Integration_build_and_push:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to awscli
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-1

    - name: Build container image
      run: docker build -t bank-app-backend:latest .

    - name: Log in to ECR with short-lived credentials
      run: |
        aws ecr get-login-password --region us-west-1 | docker login --username AWS --password-stdin ${{ vars.ECR_REPO }}

    - name: Tag Docker image
      run: docker tag bank-app-backend:latest ${{ vars.ECR_REPO }}:${{ github.run_number }}

    - name: Push image to ECR
      run: docker push ${{ vars.ECR_REPO }}:${{ github.run_number }}

    - name: Clean up Docker image locally
      run: |
        docker rmi bank-app-backend:latest
        docker rmi ${{ vars.ECR_REPO }}:${{ github.run_number }}

    - name: Clean up GitHub repo on runner
      run: rm -rf .*

  Continues-Update_k8s_manifest:
    runs-on: ubuntu-latest
    needs: Continuous-Integration_build_and_push
    steps:
    - name: Checkout Manifest Repository
      uses: actions/checkout@v3
      with:
        # Match the exact repo name
        repository: Aceglobal01/Aceglobalbank_kubernetis_Manifest
        token: ${{ secrets.GIT_PASSWORD }}
        path: Aceglobalbank_kubernetis_Manifest

    - name: Update Kubernetes Manifest
      run: |
        cd Aceglobalbank_kubernetis_Manifest/bank-project

        git config user.email "aceglobal01.01@gmail.com"
        git config user.name "aceglobal"

        # Update the image tag (matched to your file: backendapi.yaml)
        sed -i "s|${{ vars.ECR_REPO }}/bank-backendapi:.*|${{ vars.ECR_REPO }}/bank-backendapi:${{ github.run_number }}|g" backendapi.yaml

        git add backendapi.yaml

        # Only commit/push if there is a change
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update backend image to v${{ github.run_number }}" && git push origin main)
