name: Bank Backend Pipeline

on:
  push:
    branches:
    - dev-branch
  # pull_request:
  #   branches:
  #     - cicd

jobs:
  Continuous_Integration_build_and_push:
    runs-on: ubuntu-latest
    env:
      REGISTRY_NAME: ${{ secrets.REGISTRY_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      working-directory: .
      run: |
        docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
        docker tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

    - name: Push Docker images to ECR
      run: |
        docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

    - name: Clean up Docker images locally
      if: always()
      run: |
        docker rmi ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} || true
        docker rmi ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest || true

  Continues-Update_k8s_manifest:
    runs-on: ubuntu-latest
    needs: Continuous_Integration_build_and_push
    steps:
    - name: Checkout Manifest Repository
      uses: actions/checkout@v3
      with:
        # Match the exact repo name
        repository: Aceglobal01/Aceglobalbank_kubernetis_Manifest
        token: ${{ secrets.GIT_PASSWORD }}
        path: Aceglobalbank_kubernetis_Manifest

    - name: Update Kubernetes Manifest
      run: |
        cd Aceglobalbank_kubernetis_Manifest/bank-project 

        git config user.email "aceglobal01.01@gmail.com"
        git config user.name "aceglobal01"

        # Update the image tag (matched to your file: backendapi.yaml)
        sed -i "s|${{ vars.ECR_REPO }}/bank-backendapi:.*|${{ vars.ECR_REPO }}/bank-backendapi:${{ github.run_number }}|g" backendapi.yaml

        git add backendapi.yaml

        # Only commit/push if there is a change
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update backend image to v${{ github.run_number }}" && git push origin main)
